<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Saved Trips | TravelAI India</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

  <div id="app-header"></div>

  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div class="mb-8">
      <span class="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-widest">Personal Dashboard</span>
      <h1 class="text-3xl sm:text-4xl font-black text-slate-900 dark:text-white">My Saved Itineraries</h1>
    </div>

    <div id="trips-container" class="space-y-6">
      <!-- Rendered via JS -->
    </div>
  </main>

  <div id="app-footer"></div>
  <div id="app-ai-chat"></div>

  <script type="module">
    import { renderHeader, renderFooter, renderAIChatWidget, initTheme, getSavedTrips, deleteTrip } from '/js/app.js';

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('my-trips');
      renderFooter();
      renderAIChatWidget();
      initTheme();

      renderTrips();
    });

    function renderTrips() {
      const container = document.getElementById('trips-container');
      if (!container) return;

      const trips = getSavedTrips();

      if (trips.length === 0) {
        container.innerHTML = `
          <div class="bg-white dark:bg-slate-900 rounded-3xl p-12 text-center border border-slate-200 dark:border-slate-800 space-y-4">
            <i data-lucide="briefcase" class="w-12 h-12 text-slate-400 mx-auto"></i>
            <h3 class="font-extrabold text-slate-800 dark:text-slate-200 text-lg">No Saved Trips Yet</h3>
            <p class="text-xs text-slate-500 max-w-sm mx-auto">You haven't saved any AI trip itineraries yet. Head over to AI Trip Planner to create your first one!</p>
            <a href="/ai-planner.html" class="inline-flex items-center gap-2 px-6 py-3 bg-blue-600 text-white rounded-2xl text-xs font-black shadow-lg">
              Create AI Trip
            </a>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      container.innerHTML = trips.map(trip => `
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 border border-slate-200/80 dark:border-slate-800 shadow-md space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-[10px] font-black uppercase text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-950/60 px-3 py-1 rounded-full">${trip.destination} • ${trip.days || 3} Days</span>
              <h3 class="text-xl font-extrabold text-slate-900 dark:text-white mt-2">${trip.title}</h3>
            </div>
            <button class="delete-trip-btn text-rose-500 hover:text-rose-700 p-2" data-trip-id="${trip.id}">
              <i data-lucide="trash-2" class="w-5 h-5"></i>
            </button>
          </div>

          <p class="text-xs text-slate-500 dark:text-slate-400">${trip.overview}</p>

          <div class="border-t border-slate-100 dark:border-slate-800 pt-4 space-y-3">
            ${(trip.itinerary || []).map(day => `
              <div class="bg-slate-50 dark:bg-slate-800/40 p-4 rounded-2xl text-xs space-y-1">
                <span class="font-extrabold text-slate-900 dark:text-white">Day ${day.day}: ${day.title}</span>
                <p class="text-slate-600 dark:text-slate-400">${day.morning} | ${day.afternoon}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');

      if (window.lucide) window.lucide.createIcons();

      container.querySelectorAll('.delete-trip-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-trip-id');
          deleteTrip(id);
          renderTrips();
        });
      });
    }
  </script>
</body>
</html>
