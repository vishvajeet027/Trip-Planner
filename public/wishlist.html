<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishlist | TravelAI India</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

  <div id="app-header"></div>

  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div class="mb-8">
      <span class="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-widest">Saved Favorites</span>
      <h1 class="text-3xl sm:text-4xl font-black text-slate-900 dark:text-white">My Wishlist</h1>
    </div>

    <div id="wishlist-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Rendered via JS -->
    </div>
  </main>

  <div id="app-footer"></div>
  <div id="app-ai-chat"></div>

  <script type="module">
    import { renderHeader, renderFooter, renderAIChatWidget, initTheme, getWishlist, toggleWishlist } from '/js/app.js';

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('wishlist');
      renderFooter();
      renderAIChatWidget();
      initTheme();

      renderWishlistItems();
    });

    function renderWishlistItems() {
      const container = document.getElementById('wishlist-grid');
      if (!container) return;

      const list = getWishlist();

      if (list.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-white dark:bg-slate-900 rounded-3xl p-12 text-center border border-slate-200 dark:border-slate-800 space-y-4">
            <i data-lucide="heart-off" class="w-12 h-12 text-slate-400 mx-auto"></i>
            <h3 class="font-extrabold text-slate-800 dark:text-slate-200 text-lg">Your Wishlist is Empty</h3>
            <p class="text-xs text-slate-500 max-w-sm mx-auto">Explore cities and hotels to click the heart icon and bookmark your favorite stays.</p>
            <a href="/" class="inline-flex items-center gap-2 px-6 py-3 bg-blue-600 text-white rounded-2xl text-xs font-black shadow-lg">
              Explore Destinations
            </a>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="bg-white dark:bg-slate-900 rounded-3xl overflow-hidden border border-slate-200/80 dark:border-slate-800 shadow-md p-5 flex flex-col justify-between space-y-3">
          <div class="h-44 rounded-2xl overflow-hidden relative">
            <img src="${item.image}" alt="${item.name || item.title}" class="w-full h-full object-cover" />
            <button class="remove-wishlist-btn absolute top-3 right-3 w-9 h-9 rounded-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-md flex items-center justify-center text-rose-500 hover:text-rose-700" data-item-id="${item.id}">
              <i data-lucide="heart" class="w-4 h-4 fill-rose-500"></i>
            </button>
          </div>

          <div>
            <h3 class="font-extrabold text-slate-900 dark:text-white text-base">${item.name || item.title}</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mt-1">${item.description || item.tagline || ''}</p>
          </div>

          <div class="pt-2 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
            <span class="text-xs font-bold text-slate-700 dark:text-slate-300">${item.state || item.location || 'India'}</span>
            <a href="/hotels.html?search=${encodeURIComponent(item.name || '')}" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">
              View Stays
            </a>
          </div>
        </div>
      `).join('');

      if (window.lucide) window.lucide.createIcons();

      container.querySelectorAll('.remove-wishlist-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-item-id');
          const item = list.find(i => i.id === id);
          if (item) {
            toggleWishlist(item);
            renderWishlistItems();
          }
        });
      });
    }
  </script>
</body>
</html>
