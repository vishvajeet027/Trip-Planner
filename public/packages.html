<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tour Packages | TravelAI India</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

  <div id="app-header"></div>

  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div class="mb-8">
      <span class="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-widest">Handcrafted Experiences</span>
      <h1 class="text-3xl sm:text-4xl font-black text-slate-900 dark:text-white">Curated Holiday Packages</h1>
    </div>

    <div id="packages-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Rendered via JS -->
    </div>
  </main>

  <div id="app-footer"></div>
  <div id="app-ai-chat"></div>

  <script type="module">
    import { renderHeader, renderFooter, renderAIChatWidget, initTheme, showToast } from '/js/app.js';

    document.addEventListener('DOMContentLoaded', async () => {
      renderHeader('packages');
      renderFooter();
      renderAIChatWidget();
      initTheme();

      try {
        const res = await fetch('/api/packages');
        const packages = await res.json();

        const container = document.getElementById('packages-grid');
        if (!container) return;

        container.innerHTML = packages.map(pkg => `
          <div class="bg-white dark:bg-slate-900 rounded-3xl overflow-hidden border border-slate-200/80 dark:border-slate-800 shadow-md hover:shadow-xl transition-all space-y-4 p-5 flex flex-col justify-between">
            <div class="space-y-3">
              <div class="h-52 rounded-2xl overflow-hidden relative">
                <img src="${pkg.image}" alt="${pkg.title}" class="w-full h-full object-cover" />
                <div class="absolute top-3 left-3 bg-blue-600 text-white text-[10px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">
                  ${pkg.duration}
                </div>
              </div>

              <div>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${pkg.category || 'Holiday Package'}</span>
                <h3 class="font-extrabold text-slate-900 dark:text-white text-lg leading-snug">${pkg.title}</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">${pkg.description}</p>
              </div>

              <div class="space-y-1.5 pt-2">
                <span class="text-[11px] font-bold text-slate-700 dark:text-slate-300 block">Highlights:</span>
                <div class="flex items-center gap-1.5 flex-wrap">
                  ${(pkg.highlights || ['Hotels', 'Meals', 'Transfers']).map(h => `
                    <span class="px-2.5 py-1 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-lg text-[10px] font-semibold">✓ ${h}</span>
                  `).join('')}
                </div>
              </div>
            </div>

            <div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
              <div>
                <span class="text-xs text-slate-400 block font-bold">Total Price</span>
                <span class="text-xl font-black text-slate-900 dark:text-white">₹${pkg.price}</span>
              </div>
              <button class="book-pkg-btn px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold rounded-xl shadow-md transition-colors" data-pkg-title="${pkg.title}">
                Book Package
              </button>
            </div>

          </div>
        `).join('');

        if (window.lucide) window.lucide.createIcons();

        container.querySelectorAll('.book-pkg-btn').forEach(b => {
          b.addEventListener('click', () => {
            const title = b.getAttribute('data-pkg-title');
            showToast(`Package booking inquiry placed for ${title}!`, 'success');
          });
        });

      } catch (err) {
        console.error('Error fetching packages:', err);
      }
    });
  </script>
</body>
</html>
