<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Saved Trips - TravelAI India</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <!-- NAVIGATION BAR -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <i class="fas fa-brain"></i>
        <span>Travel<span class="text-gradient">AI</span></span>
      </a>

      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/pages/ai-planner.html" class="nav-link">AI Planner</a></li>
        <li><a href="/pages/explore.html" class="nav-link">Explore</a></li>
        <li><a href="/pages/stay.html" class="nav-link">Stay</a></li>
        <li><a href="/pages/my-trips.html" class="nav-link active">My Trips</a></li>
      </ul>

      <div class="nav-actions">
        <a href="/pages/ai-planner.html" class="btn btn-primary">
          <i class="fas fa-sparkles"></i> Launch AI Planner
        </a>
      </div>
    </div>
  </nav>

  <main style="padding: 3rem 0 5rem;">
    <div class="container">
      
      <div style="margin-bottom: 2.5rem;">
        <span class="ai-badge" style="margin-bottom: 0.5rem;"><i class="fas fa-bookmark"></i> Intelligence Dashboard</span>
        <h1 style="font-size: 2.4rem;">My Saved AI Trips</h1>
        <p style="color: var(--text-muted);">Manage your personal saved AI trip plans stored in browser LocalStorage.</p>
      </div>

      <div id="my-trips-container" style="display: flex; flex-direction: column; gap: 1.5rem;"></div>

    </div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/storage.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('my-trips-container');
      const trips = window.storageManager.getSavedTrips();

      if (trips.length === 0) {
        container.innerHTML = `
          <div class="glass-card" style="text-align:center;padding:4rem 1rem;">
            <i class="fas fa-folder-open" style="font-size:3.5rem;color:var(--text-subtle);margin-bottom:1rem;"></i>
            <h3>No Saved Trips Found</h3>
            <p style="color:var(--text-muted);margin-bottom:1.5rem;">Generate an itinerary using the AI Planner and click "Save to My Trips".</p>
            <a href="/pages/ai-planner.html" class="btn btn-glow"><i class="fas fa-plus"></i> Create New AI Trip</a>
          </div>
        `;
        return;
      }

      container.innerHTML = trips.map(t => `
        <div class="glass-card" style="border-left:4px solid var(--accent-cyan);">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem;margin-bottom:1rem;">
            <div>
              <div class="ai-badge" style="margin-bottom:0.4rem;"><i class="fas fa-check"></i> ${t.matchScore}% Match</div>
              <h2 style="font-size:1.6rem;">${t.destination}, ${t.state}</h2>
              <span style="font-size:0.85rem;color:var(--text-subtle);">Saved on: ${new Date(t.createdAt).toLocaleDateString()}</span>
            </div>

            <div style="display:flex;gap:0.75rem;">
              <button class="btn btn-outline" style="padding:0.4rem 0.8rem;font-size:0.85rem;color:var(--accent-rose);" onclick="deleteSavedTrip('${t.id}')">
                <i class="fas fa-trash"></i> Delete
              </button>
            </div>
          </div>

          <div style="display:flex;gap:2rem;flex-wrap:wrap;margin-bottom:1rem;padding:0.75rem 1rem;background:rgba(255,255,255,0.03);border-radius:8px;font-size:0.9rem;">
            <div><span style="color:var(--text-subtle);">Duration:</span> <strong>${t.days} Days</strong></div>
            <div><span style="color:var(--text-subtle);">Budget:</span> <strong>₹${t.budget.toLocaleString('en-IN')}</strong></div>
            <div><span style="color:var(--text-subtle);">Est Cost:</span> <strong style="color:var(--accent-emerald);">₹${t.estCost.toLocaleString('en-IN')}</strong></div>
            <div><span style="color:var(--text-subtle);">Travelers:</span> <strong>${t.travelers}</strong></div>
          </div>

          <details>
            <summary style="cursor:pointer;color:var(--accent-cyan);font-weight:600;font-size:0.95rem;">
              View Day-by-Day Itinerary (${t.itinerary.length} Days)
            </summary>
            <div style="display:flex;flex-direction:column;gap:0.75rem;margin-top:1rem;padding-left:1rem;border-left:2px solid var(--border-glass);">
              ${t.itinerary.map(day => `
                <div style="font-size:0.88rem;color:var(--text-muted);">
                  <strong style="color:var(--text-main);">${day.title}</strong>
                  <p>${day.morning}</p>
                </div>
              `).join('')}
            </div>
          </details>
        </div>
      `).join('');
    });

    function deleteSavedTrip(id) {
      if (confirm('Are you sure you want to delete this saved trip?')) {
        window.storageManager.deleteTrip(id);
        window.location.reload();
      }
    }
  </script>
</body>
</html>
